name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run tests
        run: cargo test --release

      - name: Run web crate tests
        run: cd web && cargo test --release

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Run web frontend tests
        run: cd web && npm test

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # svelte-check needs the generated bindings (web/pkg) for the worker's
      # imports; a dev build gives the same declarations without wasm-opt.
      - name: Build WASM bindings
        run: wasm-pack build web --target web --dev

      - name: Type-check web frontend
        run: cd web && npm run check
